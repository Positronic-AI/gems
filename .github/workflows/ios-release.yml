name: ios-release
# Signed Gems build → TestFlight. Manual trigger: TestFlight rejects
# duplicate build numbers, so bump pubspec +N before dispatching.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Import signing certificate
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASS=$(uuidgen)
          echo "$P12_B64" | base64 -d > dist.p12
          security create-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN
          security set-keychain-settings -t 3600 $KEYCHAIN
          security import dist.p12 -k $KEYCHAIN -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" $KEYCHAIN
          rm dist.p12
      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/gems-appstore.mobileprovision
      - name: Configure manual signing
        run: |
          cat >> ios/Flutter/Release.xcconfig <<'XC'
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM=UJ7C2D5HJB
          PROVISIONING_PROFILE_SPECIFIER=Gems App Store
          CODE_SIGN_IDENTITY=Apple Distribution
          XC
      - name: Export options
        run: |
          cat > ios/ExportOptions.plist <<'EOP'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>UJ7C2D5HJB</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>ai.positronic.gems</key><string>Gems App Store</string></dict>
          </dict></plist>
          EOP
      - name: Build signed IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_B64: ${{ secrets.ASC_API_KEY_B64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_B64" | base64 -d > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app --type ios \
            -f build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
